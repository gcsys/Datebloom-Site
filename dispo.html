<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mes disponibilités</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@600&display=swap">
<style>
/* Même univers que l'invitation : une carte, un calendrier de 4 semaines, les créneaux par jour, le lien en bas. */
:root {
  --paper: #ffe3ec; --card: #fffaf5; --ink: #2b1838; --cherry: #e6304f;
  --butter: #ffd65c; --muted: #7d5a74; --line: #f2c2d1;
  --f-display: "Shrikhand", "Cooper Black", Georgia, serif;
  --f-body: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-hand: "Caveat", "Segoe Print", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px;
  background-image: radial-gradient(var(--line) 1.4px, transparent 1.6px); background-size: 22px 22px;
  padding-inline: 16px; padding-block: 24px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--card); border: 2.5px solid var(--ink); border-radius: 22px; box-shadow: 6px 7px 0 var(--ink); padding: 24px 18px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 8vw, 38px); margin: 0; line-height: 1.1; }
h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
p { margin: 0; color: var(--muted); line-height: 1.5; }
.kicker { font-family: var(--f-hand); font-size: 24px; color: var(--cherry); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .dow { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; }
.day { font: 600 15px var(--f-body); color: var(--ink); background: var(--card); border: 2px solid var(--ink); border-radius: 10px; padding: 8px 0; cursor: pointer; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.day small { font-size: 10px; font-weight: 400; color: var(--muted); }
.day[aria-pressed="true"] { background: var(--butter); box-shadow: 2px 2px 0 var(--ink); }
.day:disabled { visibility: hidden; }
.list { display: flex; flex-direction: column; gap: 12px; }
.row { border: 2px dashed var(--ink); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; }
.slot { font: 600 13px var(--f-body); color: var(--ink); background: var(--card); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 10px; cursor: pointer; }
.slot[aria-pressed="true"] { background: var(--cherry); color: #fff; }
.empty { font-family: var(--f-hand); font-size: 22px; color: var(--muted); text-align: center; }
.link { font: 13px ui-monospace, Menlo, monospace; background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; padding: 12px; overflow-wrap: anywhere; user-select: all; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { font: 800 16px var(--f-body); border: 2.5px solid var(--ink); border-radius: 999px; padding: 12px 22px; cursor: pointer; background: var(--cherry); color: #fff; box-shadow: 3px 4px 0 var(--ink); text-decoration: none; display: inline-block; }
.btn.alt { background: var(--card); color: var(--ink); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn:focus-visible, .day:focus-visible, .slot:focus-visible { outline: 3px solid var(--butter); outline-offset: 3px; }
.ok { font-family: var(--f-hand); font-size: 22px; color: var(--cherry); min-height: 1.2em; }
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="kicker">page réservée à l'organisateur</div>
    <h1>Mes disponibilités</h1>
    <p>Touche les jours où tu es libre, puis retire les créneaux qui ne vont pas. Le lien en bas n'affichera que ces choix.</p>
    <div class="cal" id="cal"></div>
  </section>
  <section class="card">
    <h2>Jours et créneaux choisis</h2>
    <div class="list" id="list"></div>
  </section>
  <section class="card">
    <h2>Lien à envoyer</h2>
    <div class="link" id="link"></div>
    <div class="btns">
      <button class="btn" id="copy" type="button">Copier le lien</button>
      <a class="btn alt" id="test" href="./" target="_blank" rel="noopener">Tester</a>
    </div>
    <div class="ok" id="ok"></div>
  </section>
</main>
<script>
const SLOTS = ["Lever du soleil 7h30", "Matin 9h30", "Brunch 11h", "Goûter 16h", "Apéro 18h30", "Dîner 20h"];
const JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const pad = n => String(n).padStart(2, "0");
const key = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
const sel = {}; // "20261010" -> Set d'indices

// Reprend un lien existant collé après # (ex. dispo.html#20261010-03)
(location.hash.slice(1).match(/\d{8}-\d+/g) || []).forEach(p => { const [d, s] = p.split("-"); sel[d] = new Set(s.split("").map(Number).filter(i => i < 6)); });

const cal = document.getElementById("cal");
const today = new Date(); today.setHours(12, 0, 0, 0);
const start = new Date(today); start.setDate(today.getDate() - ((today.getDay() + 6) % 7)); // lundi
["L", "M", "M", "J", "V", "S", "D"].forEach(l => { const e = document.createElement("div"); e.className = "dow"; e.textContent = l; cal.appendChild(e); });
for (let i = 0; i < 35; i++) {
  const d = new Date(start); d.setDate(start.getDate() + i);
  const b = document.createElement("button");
  b.type = "button"; b.className = "day"; b.dataset.k = key(d);
  b.innerHTML = d.getDate() + "<small>" + MOIS[d.getMonth()] + "</small>";
  if (d < today) b.disabled = true;
  b.onclick = () => { const k = b.dataset.k; sel[k] ? delete sel[k] : (sel[k] = new Set([0, 1, 2, 3, 4, 5])); render(); };
  cal.appendChild(b);
}

function code() {
  return Object.keys(sel).sort().filter(k => sel[k].size).map(k => k + "-" + [...sel[k]].sort().join("")).join(".");
}
function render() {
  cal.querySelectorAll(".day").forEach(b => b.setAttribute("aria-pressed", !!sel[b.dataset.k]));
  const list = document.getElementById("list");
  list.innerHTML = "";
  const keys = Object.keys(sel).sort();
  if (!keys.length) list.innerHTML = '<div class="empty">Aucun jour choisi pour l\'instant.</div>';
  keys.forEach(k => {
    const d = new Date(+k.slice(0, 4), +k.slice(4, 6) - 1, +k.slice(6));
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = "<b>" + JOURS[d.getDay()][0].toUpperCase() + JOURS[d.getDay()].slice(1) + " " + d.getDate() + " " + MOIS[d.getMonth()] + "</b><div class='slots'></div>";
    SLOTS.forEach((s, i) => {
      const c = document.createElement("button"); c.type = "button"; c.className = "slot"; c.textContent = s;
      c.setAttribute("aria-pressed", sel[k].has(i));
      c.onclick = () => { sel[k].has(i) ? sel[k].delete(i) : sel[k].add(i); render(); };
      row.querySelector(".slots").appendChild(c);
    });
    list.appendChild(row);
  });
  const c = code();
  const url = new URL("./", location.href).href + (c ? "#" + c : "");
  document.getElementById("link").textContent = c ? url : "Choisis au moins un jour avec un créneau.";
  document.getElementById("copy").disabled = !c;
  document.getElementById("test").href = url;
  document.getElementById("ok").textContent = "";
}
document.getElementById("copy").onclick = () => {
  const t = document.getElementById("link").textContent, ok = document.getElementById("ok");
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("link")); getSelection().removeAllRanges(); getSelection().addRange(r); ok.textContent = "Lien sélectionné, copie-le."; };
  try { navigator.clipboard.writeText(t).then(() => { ok.textContent = "Lien copié !"; }, fallback); } catch (e) { fallback(); }
};
render();
</script>
</body>
</html>
